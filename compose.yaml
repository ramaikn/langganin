services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: langganin
      POSTGRES_USER: langganin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langganin"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Isi DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://langganin:${POSTGRES_PASSWORD}@db:5432/langganin
      REDIS_URL: redis://redis:6379/0
      DJANGO_TRUST_PROXY: "1"
    ports: ["127.0.0.1:8017:8000"]
    volumes: ["runtime:/data"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  runtime:
