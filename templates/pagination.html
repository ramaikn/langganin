{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Halaman data"><span>{{ page.paginator.count }} data · Halaman {{ page.number }} dari {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&q={{ q|urlencode }}&segment={{ selected_segment|default:'all'|urlencode }}">← Sebelumnya</a>{% endif %}{% if page.has_next %}<a href="?page={{ page.next_page_number }}&q={{ q|urlencode }}&segment={{ selected_segment|default:'all'|urlencode }}">Berikutnya →</a>{% endif %}</div></nav>{% endif %}
